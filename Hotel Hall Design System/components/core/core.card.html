<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="https://unpkg.com/lucide@0.428.0/dist/umd/lucide.js"></script>
<script src="../../_ds_bundle.js"></script>
<style>body{margin:0;padding:20px 22px;background:var(--surface-page)}.grp{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:14px}.cap{font-size:9px;letter-spacing:.16em;text-transform:uppercase;color:var(--text-subtle);width:100%;margin-bottom:2px}</style></head>
<body><div id="root"></div>
<script type="text/babel">
const { Button, IconButton, Card, CardTitle, CardMeta, Badge, Tag, Tabs, Tooltip } = window.HotelHallDesignSystem_6ae9d5;
function Icon({name,size=18}){const r=React.useRef(null);React.useEffect(()=>{if(r.current&&window.lucide){r.current.innerHTML='';const el=document.createElement('i');el.setAttribute('data-lucide',name);r.current.appendChild(el);window.lucide.createIcons({attrs:{width:size,height:size,'stroke-width':1.5},nameAttr:'data-lucide'});}},[name]);return <span ref={r} style={{display:'inline-flex',lineHeight:0}}/>;}
function App(){const [tab,setTab]=React.useState('rooms');
return <div>
<div className="grp"><span className="cap">Button — variants (md)</span>
<Button>Reserve</Button><Button variant="accent">Check availability</Button><Button variant="gold">Plan an event</Button><Button variant="secondary">Room details</Button><Button variant="ghost">Back</Button><Button disabled>Sold out</Button><Button loading>Reserve</Button></div>
<div className="grp"><span className="cap">Sizes · with icon · icon buttons</span>
<Button size="sm">Small</Button><Button size="md">Medium</Button><Button size="lg" iconLeft={<Icon name="calendar" size={16}/>}>Check availability</Button>
<IconButton icon={<Icon name="heart"/>} label="Save" variant="outline"/><IconButton icon={<Icon name="share-2"/>} label="Share"/><IconButton icon={<Icon name="chevron-right"/>} label="Next" variant="solid" round/>
<Tooltip label="Free cancellation until Aug 12"><IconButton icon={<Icon name="info"/>} label="Info"/></Tooltip></div>
<div className="grp"><span className="cap">Badge · Tag</span>
<Badge>Harbour view</Badge><Badge tone="teal">Breakfast included</Badge><Badge tone="gold">2 left</Badge><Badge tone="success">Confirmed</Badge><Badge tone="danger">Sold out</Badge>
<Tag selected onClick={()=>{}}>Harbour view</Tag><Tag icon={<Icon name="wifi" size={14}/>}>Wi-Fi</Tag><Tag onRemove={()=>{}}>Aug 12–15</Tag></div>
<div className="grp"><span className="cap">Tabs</span>
<Tabs items={[{id:'rooms',label:'Rooms'},{id:'suites',label:'Suites'},{id:'venue',label:'Venue',count:3}]} value={tab} onChange={setTab} style={{flex:1}}/>
<Tabs variant="segmented" items={[{id:'a',label:'Nightly'},{id:'b',label:'Total'}]}/></div>
<div style={{display:'grid',gridTemplateColumns:'1fr 1fr 1fr',gap:14,marginTop:6}}>
<Card interactive><CardTitle>Harbour Suite</CardTitle><CardMeta style={{marginTop:6}}>King bed · Sleeps 2 · 38 m²</CardMeta><div style={{marginTop:14,display:'flex',justifyContent:'space-between',alignItems:'baseline'}}><span style={{fontFamily:'var(--font-sans)',fontSize:'var(--text-lg)',color:'var(--text-heading)'}}>$248</span><span style={{fontSize:'var(--text-xs)',color:'var(--text-muted)'}}>per night</span></div></Card>
<Card featured><span className="hh-eyebrow" style={{color:'var(--gold-400)'}}>Most booked</span><CardTitle style={{marginTop:8}}>The Grand Hall</CardTitle><CardMeta style={{marginTop:6,color:'rgba(232,239,246,.7)'}}>Seats 180 · Dance floor</CardMeta><div style={{marginTop:14}}><Button variant="gold" size="sm">Request a quote</Button></div></Card>
<Card arch padding="var(--card-pad)" style={{display:'flex',flexDirection:'column',justifyContent:'flex-end',background:'var(--sand-100)'}}><CardTitle>Arch variant</CardTitle><CardMeta style={{marginTop:6}}>Venue &amp; celebration content</CardMeta></Card></div>
</div>;}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script></body></html>
