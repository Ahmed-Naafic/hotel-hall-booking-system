<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:18px 22px;background:var(--surface-page);font-family:var(--font-sans)}.row{display:flex;gap:10px;align-items:stretch}.sw{flex:1;border-radius:var(--radius-sm);display:flex;flex-direction:column;justify-content:flex-end;padding:8px;min-height:72px;font-size:10px;letter-spacing:.02em}.sw b{font-weight:500;display:block}.sw span{opacity:.75;font-size:9px}.lbl{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--text-subtle);margin-bottom:10px}</style></head><body><div style="display:flex;gap:16px;align-items:flex-end">
<div style="width:190px;height:170px;background:var(--navy-700);border-radius:var(--arch-top);position:relative"><div style="position:absolute;inset:8px;border:1px solid var(--gold-600);border-radius:112px 112px 2px 2px;opacity:.8"></div></div>
<div style="width:150px;height:130px;background:var(--sand-100);border:1px solid var(--border-subtle);border-radius:var(--arch-top)"></div>
<div style="font-size:11px;color:var(--text-muted);line-height:1.6;max-width:250px">border-radius: 120px 120px 4px 4px<br>Optional 1px gold inner hairline.<br>No textures, no noise, no gradient meshes.</div></div></body></html>
