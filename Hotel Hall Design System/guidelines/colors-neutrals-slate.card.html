<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:18px 22px;background:var(--surface-page);font-family:var(--font-sans)}.row{display:flex;gap:10px;align-items:stretch}.sw{flex:1;border-radius:var(--radius-sm);display:flex;flex-direction:column;justify-content:flex-end;padding:8px;min-height:72px;font-size:10px;letter-spacing:.02em}.sw b{font-weight:500;display:block}.sw span{opacity:.75;font-size:9px}.lbl{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--text-subtle);margin-bottom:10px}</style></head><body><div class="row"><div class="sw" style="background:var(--gray-050);color:var(--navy-800)"><b>050</b><span>#F7F8F9</span></div><div class="sw" style="background:var(--gray-100);color:var(--navy-800)"><b>100</b><span>#EEF0F3</span></div><div class="sw" style="background:var(--gray-200);color:var(--navy-800)"><b>200</b><span>#DFE3E8</span></div><div class="sw" style="background:var(--gray-300);color:var(--navy-800)"><b>300</b><span>#C4CAD2</span></div><div class="sw" style="background:var(--gray-400);color:var(--navy-800)"><b>400</b><span>#98A1AC</span></div><div class="sw" style="background:var(--gray-500);color:#fff"><b>500</b><span>#6C7783</span></div><div class="sw" style="background:var(--gray-600);color:#fff"><b>600</b><span>#4D5865</span></div><div class="sw" style="background:var(--gray-700);color:#fff"><b>700</b><span>#333C47</span></div><div class="sw" style="background:var(--gray-800);color:#fff"><b>800</b><span>#1E242C</span></div></div></body></html>
