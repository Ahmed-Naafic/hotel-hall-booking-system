<!-- @dsCard group="Guest app" viewport="1000x860" name="Guest mobile app" subtitle="Stay, mobile key and in-stay services — tap through the phone" -->
<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Hotel Hall — Guest app</title>
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="https://unpkg.com/lucide@0.428.0/dist/umd/lucide.js"></script>
<script src="../../_ds_bundle.js"></script>
<style>body{margin:0;background:var(--sand-100);display:flex;align-items:center;justify-content:center;min-height:100vh;padding:30px}
.phone{width:390px;height:800px;background:var(--surface-page);border-radius:44px;box-shadow:var(--shadow-xl),0 0 0 10px var(--navy-800);overflow:hidden;display:flex;flex-direction:column;position:relative}
.scroll{flex:1;overflow-y:auto}.scroll::-webkit-scrollbar{width:0}</style></head>
<body><div id="root"></div>
<script type="text/babel" src="Chrome.jsx"></script>
<script type="text/babel" src="Screens.jsx"></script>
<script type="text/babel">
const { Toast } = window.HotelHallDesignSystem_6ae9d5;
function App(){
  const [route,setRoute]=React.useState('stay');
  const [unlocked,setUnlocked]=React.useState(false);
  const [toast,setToast]=React.useState(null);
  React.useEffect(()=>{if(toast){const t=setTimeout(()=>setToast(null),4000);return ()=>clearTimeout(t);}},[toast]);
  const unlock=()=>{setUnlocked(true);setTimeout(()=>setUnlocked(false),5000);};
  return <div className="phone">
    <StatusBar/>
    <div className="scroll">
      {route==='stay' && <StayScreen go={setRoute}/>}
      {route==='key' && <KeyScreen go={setRoute} unlocked={unlocked} onUnlock={unlock}/>}
      {route==='services' && <ServicesScreen go={setRoute} onOrder={(t)=>setToast({title:'Added to your stay',message:`${t} — charged to room 812.`})}/>}
    </div>
    <TabBar route={route} go={setRoute}/>
    {toast?<div style={{position:'absolute',left:16,right:16,bottom:96,zIndex:50}}><Toast tone="success" title={toast.title} message={toast.message} onDismiss={()=>setToast(null)} style={{minWidth:0,maxWidth:'none'}}/></div>:null}
  </div>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script></body></html>
