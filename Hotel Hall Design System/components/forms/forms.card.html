<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="https://unpkg.com/lucide@0.428.0/dist/umd/lucide.js"></script>
<script src="../../_ds_bundle.js"></script>
<style>body{margin:0;padding:20px 22px;background:var(--surface-page)}.cap{font-size:9px;letter-spacing:.16em;text-transform:uppercase;color:var(--text-subtle);margin-bottom:8px}</style></head>
<body><div id="root"></div>
<script type="text/babel">
const { Input, Select, Checkbox, Radio, RadioGroup, Switch, DateField } = window.HotelHallDesignSystem_6ae9d5;
function Icon({name,size=16}){const r=React.useRef(null);React.useEffect(()=>{if(r.current&&window.lucide){r.current.innerHTML='';const el=document.createElement('i');el.setAttribute('data-lucide',name);r.current.appendChild(el);window.lucide.createIcons({attrs:{width:size,height:size,'stroke-width':1.5},nameAttr:'data-lucide'});}},[name]);return <span ref={r} style={{display:'inline-flex',lineHeight:0}}/>;}
function App(){const [rate,setRate]=React.useState('flex');
return <div style={{display:'grid',gridTemplateColumns:'1.1fr 1fr 1fr',gap:24}}>
<div><div className="cap">Input · Select</div>
<Input label="Email" placeholder="you@example.com" hint="Your confirmation goes here." iconLeft={<Icon name="mail"/>}/>
<div style={{height:14}}/><Input label="Card number" defaultValue="4242 4242 4242 4242" error="That card was declined."/>
<div style={{height:14}}/><Select label="Guests" options={["1 guest","2 guests","3 guests","4 guests"]}/>
<div style={{height:14}}/><Input label="Room" defaultValue="Harbour Suite" disabled/></div>
<div><div className="cap">DateField</div><DateField checkIn="Aug 12" checkOut="Aug 15" nights={3}/>
<div style={{height:18}}/><div className="cap">Switch</div>
<div style={{display:'flex',flexDirection:'column',gap:12}}><Switch label="Daily housekeeping" defaultChecked/><Switch label="Do not disturb"/><Switch label="Late checkout" disabled/></div></div>
<div><div className="cap">Radio group</div>
<RadioGroup value={rate} onChange={setRate} options={[{value:'flex',label:'Flexible',description:'Free cancellation until Aug 12'},{value:'saver',label:'Advance saver',description:'Non-refundable · save $32'}]}/>
<div style={{height:18}}/><div className="cap">Checkbox</div>
<div style={{display:'flex',flexDirection:'column',gap:12}}><Checkbox label="Add breakfast" description="$28 per guest, 7–10 AM" defaultChecked/><Checkbox label="Airport transfer"/><Checkbox label="Connecting rooms" disabled/></div></div>
</div>;}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script></body></html>
