<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Hotel Hall — Booking website</title>
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="https://unpkg.com/lucide@0.428.0/dist/umd/lucide.js"></script>
<script src="../../_ds_bundle.js"></script>
<style>body{margin:0;background:var(--surface-page)}#toasts{position:fixed;right:24px;bottom:24px;z-index:60;display:flex;flex-direction:column;gap:10px}</style></head>
<body><div id="root"></div>
<script type="text/babel" src="Shell.jsx"></script>
<script type="text/babel" src="data.jsx"></script>
<script type="text/babel" src="Home.jsx"></script>
<script type="text/babel" src="Rooms.jsx"></script>
<script type="text/babel" src="Venue.jsx"></script>
<script type="text/babel" src="Checkout.jsx"></script>
<script type="text/babel">
const { Toast, Button } = window.HotelHallDesignSystem_6ae9d5;
function App(){
  const [route,setRoute]=React.useState('home');
  const [room,setRoom]=React.useState(ROOMS[0]);
  const [toast,setToast]=React.useState(null);
  const go=(r)=>{setRoute(r);window.scrollTo({top:0});};
  const overHero = route==='home'||route==='venue';
  React.useEffect(()=>{if(toast){const t=setTimeout(()=>setToast(null),6000);return ()=>clearTimeout(t);}},[toast]);
  return <div>
    <Header route={route} go={go} overHero={overHero}/>
    {route==='home' && <Home go={go}/>}
    {route==='rooms' && <Rooms go={go} onReserve={(r)=>{setRoom(r);go('checkout');}}/>}
    {route==='venue' && <Venue go={go}/>}
    {route==='checkout' && <Checkout room={room} go={go} onConfirmed={()=>{go('home');setToast({title:'Reserved',message:'Confirmation 4821-HH is in your inbox.'});}}/>}
    <Footer go={go}/>
    <div id="toasts">{toast?<Toast tone="success" title={toast.title} message={toast.message} onDismiss={()=>setToast(null)}/>:null}</div>
  </div>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script></body></html>
