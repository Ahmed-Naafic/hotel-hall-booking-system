org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
# Firebase (Notification V1) introduced the first Android plugin with real
# Kotlin sources to compile in this project. Kotlin's incremental-compilation
# cache computes a relative path between the Gradle project dir and the
# Flutter pub cache; on Windows, when those live on different drive letters
# (a per-machine setup detail, not a project one), that relativization throws
# ("this and base files have different roots"). Disabling Kotlin incremental
# compilation is the standard workaround — full recompiles are slightly
# slower, never incorrect.
kotlin.incremental=false
