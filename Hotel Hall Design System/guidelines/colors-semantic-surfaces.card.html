<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:18px 22px;background:var(--surface-page);font-family:var(--font-sans)}.row{display:flex;gap:10px;align-items:stretch}.sw{flex:1;border-radius:var(--radius-sm);display:flex;flex-direction:column;justify-content:flex-end;padding:8px;min-height:72px;font-size:10px;letter-spacing:.02em}.sw b{font-weight:500;display:block}.sw span{opacity:.75;font-size:9px}.lbl{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--text-subtle);margin-bottom:10px}</style></head><body><div style="display:grid;grid-template-columns:repeat(6,1fr);gap:8px">
<div style="background:var(--surface-page);color:var(--navy-700);border:1px solid var(--border-subtle);border-radius:var(--radius-md);height:90px;display:flex;align-items:flex-end;padding:8px;font-size:10px;letter-spacing:.08em;text-transform:uppercase">page</div><div style="background:var(--surface-card);color:var(--navy-700);border:1px solid var(--border-subtle);border-radius:var(--radius-md);height:90px;display:flex;align-items:flex-end;padding:8px;font-size:10px;letter-spacing:.08em;text-transform:uppercase">card</div><div style="background:var(--surface-sunken);color:var(--navy-700);border:1px solid var(--border-subtle);border-radius:var(--radius-md);height:90px;display:flex;align-items:flex-end;padding:8px;font-size:10px;letter-spacing:.08em;text-transform:uppercase">sunken</div><div style="background:var(--surface-navy);color:#fff;border:1px solid var(--border-subtle);border-radius:var(--radius-md);height:90px;display:flex;align-items:flex-end;padding:8px;font-size:10px;letter-spacing:.08em;text-transform:uppercase">navy</div><div style="background:var(--surface-teal);color:#fff;border:1px solid var(--border-subtle);border-radius:var(--radius-md);height:90px;display:flex;align-items:flex-end;padding:8px;font-size:10px;letter-spacing:.08em;text-transform:uppercase">teal</div><div style="background:var(--surface-gold-tint);color:var(--gold-900);border:1px solid var(--border-subtle);border-radius:var(--radius-md);height:90px;display:flex;align-items:flex-end;padding:8px;font-size:10px;letter-spacing:.08em;text-transform:uppercase">gold tint</div></div></body></html>
