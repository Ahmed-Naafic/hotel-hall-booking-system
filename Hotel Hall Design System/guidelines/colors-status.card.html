<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:18px 22px;background:var(--surface-page);font-family:var(--font-sans)}.row{display:flex;gap:10px;align-items:stretch}.sw{flex:1;border-radius:var(--radius-sm);display:flex;flex-direction:column;justify-content:flex-end;padding:8px;min-height:72px;font-size:10px;letter-spacing:.02em}.sw b{font-weight:500;display:block}.sw span{opacity:.75;font-size:9px}.lbl{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--text-subtle);margin-bottom:10px}</style></head><body><div class="row"><div class="sw" style="background:var(--success-500);color:#fff"><b>success</b><span>#2F9160</span></div><div class="sw" style="background:var(--success-100);color:var(--gray-700)"><b>success-100</b><span>#E4F2EA</span></div><div class="sw" style="background:var(--warning-500);color:#fff"><b>warning</b><span>#C98A22</span></div><div class="sw" style="background:var(--warning-100);color:var(--gray-700)"><b>warning-100</b><span>#FBF0DA</span></div><div class="sw" style="background:var(--danger-500);color:#fff"><b>danger</b><span>#BF3B33</span></div><div class="sw" style="background:var(--danger-100);color:var(--gray-700)"><b>danger-100</b><span>#FAE8E6</span></div></div></body></html>
