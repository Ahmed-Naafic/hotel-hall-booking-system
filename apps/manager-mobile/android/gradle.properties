org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
# Kotlin's incremental compiler crashes ("this and base files have different
# roots") when relativizing paths across two different Windows drive letters —
# this project lives on D:\, the global Pub cache on C:\. Disabling incremental
# compilation avoids the crash; it only costs a slower (non-incremental) Kotlin
# compile step, nothing else.
kotlin.incremental=false
