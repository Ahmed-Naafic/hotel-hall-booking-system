<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:18px 22px;background:var(--surface-page);font-family:var(--font-sans)}.row{display:flex;gap:10px;align-items:stretch}.sw{flex:1;border-radius:var(--radius-sm);display:flex;flex-direction:column;justify-content:flex-end;padding:8px;min-height:72px;font-size:10px;letter-spacing:.02em}.sw b{font-weight:500;display:block}.sw span{opacity:.75;font-size:9px}.lbl{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--text-subtle);margin-bottom:10px}</style></head><body><style>@keyframes hh{0%,100%{transform:none;box-shadow:var(--shadow-sm)}50%{transform:translateY(-2px);box-shadow:var(--shadow-md)}}</style>

<div style="width:150px;height:86px;background:#fff;border:1px solid var(--border-subtle);border-radius:var(--radius-lg);animation:hh 2.2s var(--ease-standard) infinite"></div>
